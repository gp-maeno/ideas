<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ideas Lab</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;700&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0a0a0a',
            surface: '#141414',
            'surface-hover': '#1c1c1c',
            border: '#252525',
            'border-hover': '#333333',
            text: '#e8e8e8',
            'text-muted': '#737373',
            accent: '#c4f042',
            'accent-dim': 'rgba(196, 240, 66, 0.08)',
          },
          fontFamily: {
            heading: ['Inter', 'Noto Sans JP', 'sans-serif'],
            body: ['Noto Sans JP', 'Inter', 'sans-serif'],
            mono: ['DM Mono', 'monospace'],
          },
          borderRadius: {
            card: '12px',
          },
        },
      },
    }
  </script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./assets/css/gallery.css">
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <!-- Gallery Logic -->
  <script src="./assets/js/gallery.js"></script>
</head>
<body class="bg-bg text-text font-body min-h-screen antialiased">

  <div x-data="gallery">

    <!-- Header -->
    <header class="max-w-[1400px] mx-auto pt-12 pb-8 px-8 max-md:px-5 max-md:pt-8 max-md:pb-6">
      <h1 class="font-heading text-[clamp(2.5rem,7vw,4.5rem)] font-semibold leading-none tracking-tight mb-2">
        Ideas <span class="text-accent">Lab</span>
      </h1>
      <p class="text-text-muted text-sm tracking-wide">Daily experiments & prototypes</p>
    </header>

    <!-- Filter Bar -->
    <div class="max-w-[1400px] mx-auto px-8 max-md:px-5 flex gap-2 flex-wrap items-center border-b border-border mb-8 pb-4">
      <span class="text-text-muted text-[0.7rem] uppercase tracking-widest mr-2">Filter</span>
      <button
        @click="setTag('all')"
        :class="activeTag === 'all'
          ? 'bg-accent border-accent text-bg'
          : 'bg-transparent border-border text-text-muted hover:border-text-muted hover:text-text'"
        class="border rounded-full px-3 py-1.5 font-body text-[0.7rem] cursor-pointer transition-all duration-200"
      >All</button>
      <template x-for="tag in allTags" :key="tag">
        <button
          @click="setTag(tag)"
          :class="activeTag === tag
            ? 'bg-accent border-accent text-bg'
            : 'bg-transparent border-border text-text-muted hover:border-text-muted hover:text-text'"
          class="border rounded-full px-3 py-1.5 font-body text-[0.7rem] cursor-pointer transition-all duration-200"
          x-text="tag"
        ></button>
      </template>
    </div>

    <!-- Counter -->
    <div
      x-show="!loading && !error"
      class="max-w-[1400px] mx-auto px-8 max-md:px-5 pb-4 text-[0.7rem] text-text-muted tracking-wide"
      x-text="countText"
    ></div>

    <!-- Loading -->
    <div x-show="loading" class="text-center py-24 text-text-muted text-sm loading-spinner">
      Loading projects
    </div>

    <!-- Error / Empty -->
    <div x-show="!loading && error" class="text-center py-24 max-w-[1400px] mx-auto">
      <p class="text-text-muted text-sm">No projects yet. Push your first project to get started.</p>
    </div>

    <!-- No match -->
    <div x-show="!loading && !error && filtered.length === 0" class="text-center py-24 max-w-[1400px] mx-auto">
      <p class="text-text-muted text-sm">No projects match the selected filter.</p>
    </div>

    <!-- Grid -->
    <div
      x-show="!loading && !error && filtered.length > 0"
      class="grid grid-cols-[repeat(auto-fill,minmax(260px,1fr))] gap-3 max-w-[1400px] mx-auto mb-16 px-8 max-md:grid-cols-2 max-md:px-4 max-md:gap-2 max-[479px]:grid-cols-1 max-[479px]:px-4"
    >
      <template x-for="(project, i) in filtered" :key="project.slug">
        <a
          :href="'./' + project.slug + '/'"
          class="card-square card-fade-in group bg-surface border border-border rounded-card p-6 flex flex-col gap-3 transition-all duration-300 cursor-pointer no-underline text-inherit relative overflow-hidden hover:bg-surface-hover hover:border-border-hover max-md:p-5 max-[479px]:p-6"
          :style="'animation-delay:' + (i * 0.06) + 's'"
        >
          <!-- Meta -->
          <div class="flex justify-between items-center">
            <span class="font-mono text-[0.7rem] text-text-muted tracking-wide" x-text="project.date"></span>
            <span class="text-[0.6rem] uppercase tracking-widest text-accent bg-accent-dim px-2 py-0.5 rounded" x-text="project.type"></span>
          </div>
          <!-- Title -->
          <div class="font-heading text-[1.2rem] font-bold leading-snug grow line-clamp-3 group-hover:text-accent transition-colors duration-300 max-md:text-base max-[479px]:text-lg" x-text="project.title"></div>
          <!-- Description -->
          <div
            x-show="project.description"
            class="text-[0.75rem] text-text-muted leading-relaxed line-clamp-2 max-md:text-[0.7rem]"
            x-text="project.description"
          ></div>
          <!-- Footer -->
          <div class="flex justify-between items-end">
            <div class="flex gap-1.5 flex-nowrap overflow-hidden">
              <template x-for="tag in project.tags" :key="tag">
                <span class="text-[0.6rem] text-text-muted border border-border px-2 py-0.5 rounded tracking-wide" x-text="tag"></span>
              </template>
            </div>
            <span class="text-xl text-accent opacity-40 transition-all duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 group-hover:opacity-100">↗</span>
          </div>
        </a>
      </template>
    </div>

  </div>

</body>
</html>
