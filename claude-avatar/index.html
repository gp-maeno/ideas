<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Unofficial Claude Avatar Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+JP:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/avatar.css">
</head>
<body>

<header class="header">
  <a href="../" class="header__back">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    Gallery
  </a>
  <span class="header__title">UNOFFICIAL CLAUDE AVATAR GENERATOR</span>
</header>

<main class="main">
  <!-- プレビュー -->
  <div class="preview" id="preview"></div>

  <!-- カスタマイズパネル -->
  <div class="panel">
    <div class="panel__tabs" id="panel-tabs"></div>
    <div class="panel__options" id="panel-options"></div>
  </div>

  <!-- アクションボタン -->
  <div class="actions">
    <button class="btn" id="btn-clear">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      クリア
    </button>
    <button class="btn" id="btn-random">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 4l3 3-3 3"/><path d="M18 20l3-3-3-3"/><path d="M3 7h4l9 10h5"/><path d="M21 7h-5l-3.5 4"/><path d="M3 17h4l3.5-4"/></svg>
      ランダム
    </button>
    <button class="btn btn--primary" id="btn-download">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      DL
    </button>
  </div>
</main>

<footer class="disclaimer">
  This is an unofficial fan-made project. Not affiliated with or endorsed by Anthropic.
</footer>

<script src="./assets/js/avatar.js"></script>
</body>
</html>
