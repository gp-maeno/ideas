<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Stella - 星座ビューア</title>
<style>
:root {
  --bg: #020208;
  --ui-bg: rgba(6,6,20,0.88);
  --ui-border: rgba(80,100,160,0.25);
  --accent: #7eb8f0;
  --accent-dim: rgba(126,184,240,0.15);
  --text: #c8d0e0;
  --text-muted: #606880;
  --font: 'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text);touch-action:none}
canvas{display:block}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:1000;transition:opacity 0.6s}
#loading.hidden{opacity:0;pointer-events:none}
#loading h1{font-size:2rem;font-weight:200;letter-spacing:0.3em;margin-bottom:1rem}
#loading .sub{font-size:0.8rem;color:var(--text-muted);letter-spacing:0.1em}
#loading .bar{width:200px;height:2px;background:rgba(255,255,255,0.1);margin-top:1.5rem;border-radius:1px;overflow:hidden}
#loading .bar .fill{width:0%;height:100%;background:var(--accent);transition:width 0.3s}
.gyro-prompt{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,2,8,0.9);z-index:900}
.gyro-prompt button{background:var(--accent);color:#000;border:none;padding:1rem 2.5rem;font-size:1rem;border-radius:8px;font-family:var(--font);cursor:pointer}
.gyro-prompt.hidden{display:none}
/* Common menu bar */
#menubar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 0.75rem;z-index:100;background:linear-gradient(to bottom,rgba(2,2,8,0.7),transparent);pointer-events:none}
#menubar>*{pointer-events:auto}
#menu-left{display:flex;align-items:center;gap:0.5rem}
#menu-right{display:flex;align-items:center;gap:0.5rem}
#back-link{color:var(--text-muted);text-decoration:none;font-size:0.7rem;display:flex;align-items:center;gap:0.25rem;padding:0.3rem 0.55rem;border-radius:6px;background:var(--ui-bg);border:1px solid var(--ui-border);transition:color 0.15s}
#back-link:hover{color:var(--accent)}
#back-link svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
#compass{min-width:36px;height:36px;border-radius:50%;background:var(--ui-bg);border:1px solid var(--ui-border);display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:600;letter-spacing:0.04em;color:var(--accent)}
#info{text-align:right;font-size:0.6rem;color:var(--text-muted);line-height:1.5;background:var(--ui-bg);padding:0.3rem 0.6rem;border-radius:6px;border:1px solid var(--ui-border)}
#panel-toggle{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ui-bg);border:1px solid var(--ui-border);color:var(--text);padding:0.6rem 1.5rem;border-radius:24px;font-size:0.75rem;font-family:var(--font);z-index:100;cursor:pointer;letter-spacing:0.08em;backdrop-filter:blur(8px)}
#panel{position:fixed;bottom:0;left:0;right:0;max-height:55vh;background:var(--ui-bg);border-top:1px solid var(--ui-border);backdrop-filter:blur(16px);z-index:200;transform:translateY(100%);transition:transform 0.35s cubic-bezier(.4,0,.2,1);overflow:hidden;display:flex;flex-direction:column;border-radius:16px 16px 0 0}
#panel.open{transform:translateY(0)}
#panel-header{padding:0.8rem 1rem;display:flex;gap:0.6rem;align-items:center;border-bottom:1px solid var(--ui-border);flex-shrink:0}
#panel-header input{flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--ui-border);color:var(--text);padding:0.45rem 0.7rem;border-radius:8px;font-size:0.8rem;font-family:var(--font);outline:none}
#panel-header input::placeholder{color:var(--text-muted)}
#panel-close{background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;padding:0.3rem}
#panel-tabs{display:flex;border-bottom:1px solid var(--ui-border);flex-shrink:0}
.tab-btn{flex:1;background:none;border:none;color:var(--text-muted);padding:0.55rem;font-size:0.7rem;font-family:var(--font);cursor:pointer;letter-spacing:0.08em;border-bottom:2px solid transparent}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
#panel-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.constellation-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;padding:0.5rem}
.const-item{padding:0.65rem 0.75rem;cursor:pointer;border-radius:6px;transition:background 0.15s;border:1px solid transparent}
.const-item:active,.const-item:hover{background:var(--accent-dim)}
.const-item .ja{font-size:0.85rem;display:block;margin-bottom:0.1rem}
.const-item .latin{font-size:0.6rem;color:var(--text-muted);letter-spacing:0.04em}
.const-item.active{background:var(--accent-dim);border-color:var(--accent)}
.settings-content{padding:1rem}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:0.65rem 0;border-bottom:1px solid var(--ui-border)}
.setting-row label{font-size:0.8rem}
.setting-row input[type=range]{width:120px;accent-color:var(--accent)}
.setting-row select{background:rgba(255,255,255,0.06);border:1px solid var(--ui-border);color:var(--text);padding:0.35rem 0.5rem;border-radius:6px;font-family:var(--font);font-size:0.8rem}
.toggle{width:42px;height:24px;background:rgba(255,255,255,0.15);border-radius:12px;position:relative;cursor:pointer;transition:background 0.2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform 0.2s}
.toggle.on::after{transform:translateX(18px)}
.datetime-content{padding:1rem}
.datetime-content label{display:block;font-size:0.7rem;color:var(--text-muted);margin-bottom:0.3rem;letter-spacing:0.05em}
.datetime-content input{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--ui-border);color:var(--text);padding:0.5rem;border-radius:6px;font-family:var(--font);font-size:0.85rem;margin-bottom:0.8rem}
.btn-row{display:flex;gap:0.5rem;margin-top:0.5rem}
.btn-row button{flex:1;padding:0.6rem;border-radius:6px;border:1px solid var(--ui-border);background:var(--accent-dim);color:var(--accent);font-family:var(--font);font-size:0.75rem;cursor:pointer}
.btn-row button.primary{background:var(--accent);color:#000;border-color:var(--accent)}
#constellation-label{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.6rem;font-weight:200;letter-spacing:0.2em;color:rgba(126,184,240,0.8);pointer-events:none;z-index:50;opacity:0;transition:opacity 0.5s;text-shadow:0 0 30px rgba(126,184,240,0.3)}
#constellation-label.visible{opacity:1}
/* Direction guide overlay (gyro mode) */
#direction-guide{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:55;opacity:0;transition:opacity 0.4s}
#direction-guide.visible{opacity:1}
#direction-guide .guide-name{font-size:1.4rem;font-weight:200;letter-spacing:0.2em;color:var(--accent);text-shadow:0 0 20px rgba(126,184,240,0.4);margin-bottom:0.5rem}
#direction-guide .guide-arrow{font-size:2rem;color:var(--accent);margin-bottom:0.3rem;transition:transform 0.3s}
#direction-guide .guide-info{font-size:0.75rem;color:var(--text-muted);letter-spacing:0.08em}
</style>
</head>
<body>
<div id="loading"><h1>STELLA</h1><div class="sub">星座ビューアを読み込み中</div><div class="bar"><div class="fill" id="loadbar"></div></div></div>
<div class="gyro-prompt hidden" id="gyroPrompt"><button id="gyroBtn">ジャイロセンサーを有効にする</button></div>
<div id="menubar">
  <div id="menu-left"><a id="back-link" href="../"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Gallery</a><div id="compass">N</div></div>
  <div id="menu-right"><div id="info"><div id="info-time">--:--</div><div id="info-location">--</div></div></div>
</div>
<div id="constellation-label"></div>
<div id="direction-guide"><div class="guide-arrow">↑</div><div class="guide-name"></div><div class="guide-info"></div></div>
<button id="panel-toggle">☰ 星座一覧</button>
<div id="panel">
  <div id="panel-header"><input type="text" id="search" placeholder="星座を検索..."><button id="panel-close">✕</button></div>
  <div id="panel-tabs">
    <button class="tab-btn active" data-tab="constellations">星座</button>
    <button class="tab-btn" data-tab="settings">表示設定</button>
    <button class="tab-btn" data-tab="datetime">日時・場所</button>
  </div>
  <div id="panel-body">
    <div id="tab-constellations" class="constellation-list"></div>
    <div id="tab-settings" class="settings-content" style="display:none">
      <div class="setting-row"><label>星座線</label><div class="toggle on" data-setting="showLines"></div></div>
      <div class="setting-row"><label>星座名</label><div class="toggle on" data-setting="showNames"></div></div>
      <div class="setting-row"><label>天の川</label><div class="toggle on" data-setting="showMilkyWay"></div></div>
      <div class="setting-row"><label>地平線グリッド</label><div class="toggle" data-setting="showGrid"></div></div>
      <div class="setting-row"><label>星の明るさ</label><input type="range" min="0.5" max="5" step="0.1" value="2.5" data-setting="starBrightness"></div>
      <div class="setting-row"><label>表示する星</label><select id="mag-limit"><option value="3">3等星まで（明るい星のみ）</option><option value="4">4等星まで</option><option value="5">5等星まで</option><option value="6" selected>6等星まで（すべて）</option></select></div>
    </div>
    <div id="tab-datetime" class="datetime-content" style="display:none">
      <label>日付</label><input type="date" id="inp-date">
      <label>時刻</label><input type="time" id="inp-time">
      <label>緯度</label><input type="number" id="inp-lat" step="0.01" placeholder="35.68">
      <label>経度</label><input type="number" id="inp-lon" step="0.01" placeholder="139.77">
      <div class="btn-row"><button id="btn-now" class="primary">現在に戻す</button><button id="btn-apply">適用</button></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA_BASE='https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/';
const SPHERE_R=500;
const state={showLines:true,showNames:true,showMilkyWay:true,showGrid:false,starBrightness:2.5,magLimit:6,lat:35.6812,lon:139.7671,date:new Date(),useGyro:false,selectedConstellation:null,gyroAlpha:0,gyroBeta:0,gyroGamma:0};
let scene,camera,renderer,starPoints,starGeometry,constellationLines={},constellationLabels={},constellationStarIndices={},milkyWayMesh,gridGroup,constellationData={},starMap={},rawStarData=null;
let touchStartX,touchStartY,camTheta=Math.PI/2,camPhi=0;

// Camera animation
let camAnimating=false,camFromTheta=0,camFromPhi=0,camToTheta=0,camToPhi=0,camAnimT=0;
const CAM_ANIM_DURATION=1.0; // seconds

// Direction guide
let guideTimer=null;

// ============================================================
// Data Loading
// ============================================================
async function loadData(){
  const lb=document.getElementById('loadbar');lb.style.width='10%';
  const urls={stars:DATA_BASE+'stars.6.json',lines:DATA_BASE+'constellations.lines.json',names:DATA_BASE+'constellations.json',mw:DATA_BASE+'mw.json'};
  const results={},keys=Object.keys(urls);
  for(let i=0;i<keys.length;i++){
    try{const r=await fetch(urls[keys[i]]);results[keys[i]]=await r.json();}catch(e){console.warn(`Failed: ${keys[i]}`,e);results[keys[i]]=null;}
    lb.style.width=(10+(i+1)/keys.length*60)+'%';
  }
  return results;
}

// ============================================================
// Coordinate Conversions
// ============================================================
function lonToRA(lon){return lon<0?360+lon:lon;}
function radecToXYZ(ra,dec,R){const r=ra*Math.PI/180,d=dec*Math.PI/180;return new THREE.Vector3(R*Math.cos(d)*Math.cos(r),R*Math.sin(d),-R*Math.cos(d)*Math.sin(r));}
function bvToColor(bv){bv=Math.max(-0.4,Math.min(2.0,parseFloat(bv)||0));let r,g,b;if(bv<0){r=0.7-bv*0.5;g=0.8-bv*0.3;b=1.0;}else if(bv<0.4){r=0.8+bv*0.5;g=0.85+bv*0.2;b=1.0-bv*0.3;}else if(bv<0.8){r=1.0;g=1.0-(bv-0.4)*0.6;b=0.7-(bv-0.4)*0.8;}else{r=1.0;g=0.7-(bv-0.8)*0.4;b=Math.max(0.1,0.3-(bv-0.8)*0.3);}return new THREE.Color(Math.min(1,r),Math.min(1,g),Math.min(1,b));}
function magToSize(mag){if(mag>state.magLimit)return 0;return Math.max(0.8,(7-mag)*state.starBrightness);}

function julianDate(d){const y=d.getUTCFullYear(),m=d.getUTCMonth()+1,dd=d.getUTCDate(),h=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;let yy=y,mm=m;if(mm<=2){yy--;mm+=12;}const A=Math.floor(yy/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(yy+4716))+Math.floor(30.6001*(mm+1))+dd+h/24+B-1524.5;}
function greenwichSiderealTime(jd){const T=(jd-2451545.0)/36525.0;let g=280.46061837+360.98564736629*(jd-2451545.0)+T*T*0.000387933-T*T*T/38710000;return((g%360)+360)%360;}
function localSiderealTime(jd,lon){return(greenwichSiderealTime(jd)+lon+360)%360;}

// ============================================================
// Scene Setup
// ============================================================
function initScene(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000);
  camera.position.set(0,0,0);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0x020208);
  document.body.appendChild(renderer.domElement);
}

// ============================================================
// Stars
// ============================================================
function createStars(data){
  if(!data||!data.features)return;
  rawStarData=data;
  const n=data.features.length;
  const pos=new Float32Array(n*3),col=new Float32Array(n*3),baseCol=new Float32Array(n*3),sz=new Float32Array(n);
  data.features.forEach((f,i)=>{
    const ra=lonToRA(f.geometry.coordinates[0]),dec=f.geometry.coordinates[1];
    const p=radecToXYZ(ra,dec,SPHERE_R);
    pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;
    const c=bvToColor(f.properties.bv);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    baseCol[i*3]=c.r;baseCol[i*3+1]=c.g;baseCol[i*3+2]=c.b;
    sz[i]=magToSize(f.properties.mag);
    starMap[f.id]={index:i,ra,dec,pos:p,mag:f.properties.mag};
  });
  starGeometry=new THREE.BufferGeometry();
  starGeometry.setAttribute('position',new THREE.BufferAttribute(pos,3));
  starGeometry.setAttribute('color',new THREE.BufferAttribute(col,3));
  starGeometry.setAttribute('baseColor',new THREE.BufferAttribute(baseCol,3));
  starGeometry.setAttribute('size',new THREE.BufferAttribute(sz,1));
  const vs=`attribute float size;varying vec3 vColor;void main(){vColor=color;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*(250.0/-mv.z);if(size<=0.0){gl_Position=vec4(2.0,2.0,2.0,1.0);return;}gl_Position=projectionMatrix*mv;}`;
  const fs=`varying vec3 vColor;void main(){float d=length(gl_PointCoord-vec2(0.5));if(d>0.5)discard;float a=smoothstep(0.5,0.0,d);float g=exp(-d*3.5)*0.7;float t=a+g;gl_FragColor=vec4(vColor*t,t*0.85);}`;
  starPoints=new THREE.Points(starGeometry,new THREE.ShaderMaterial({vertexShader:vs,fragmentShader:fs,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  scene.add(starPoints);
}

function updateStarSizes(){
  if(!rawStarData||!starGeometry)return;
  const sz=starGeometry.attributes.size;
  rawStarData.features.forEach((f,i)=>{sz.array[i]=magToSize(f.properties.mag);});
  sz.needsUpdate=true;
  // Re-apply highlight if active
  if(state.selectedConstellation) applyHighlight(state.selectedConstellation);
}

// ============================================================
// Constellation Lines
// ============================================================
function createConstellationLines(linesData,namesData){
  if(!linesData||!linesData.features)return;
  const nameMap={};
  if(namesData&&namesData.features)namesData.features.forEach(f=>{nameMap[f.id]={name:f.properties.name,ja:f.properties.ja||f.properties.name,display:f.properties.display};});
  linesData.features.forEach(f=>{
    const id=f.id,info=nameMap[id]||{name:id,ja:id};
    constellationData[id]=info;
    const coords=f.geometry.coordinates,lp=[];
    const vertexCoords=new Set();
    coords.forEach(seg=>{
      for(let i=0;i<seg.length-1;i++){
        const p1=radecToXYZ(lonToRA(seg[i][0]),seg[i][1],SPHERE_R*0.998);
        const p2=radecToXYZ(lonToRA(seg[i+1][0]),seg[i+1][1],SPHERE_R*0.998);
        lp.push(p1.x,p1.y,p1.z,p2.x,p2.y,p2.z);
      }
      seg.forEach(c=>vertexCoords.add(c[0].toFixed(2)+','+c[1].toFixed(2)));
    });
    const matched=[];
    if(rawStarData){
      vertexCoords.forEach(k=>{
        const[lo,la]=k.split(',').map(Number);
        let best=1.0,bi=-1;
        rawStarData.features.forEach((sf,si)=>{
          const d=Math.sqrt((sf.geometry.coordinates[0]-lo)**2+(sf.geometry.coordinates[1]-la)**2);
          if(d<best){best=d;bi=si;}
        });
        if(bi>=0)matched.push(bi);
      });
    }
    constellationStarIndices[id]=[...new Set(matched)];
    if(!lp.length)return;
    const geom=new THREE.BufferGeometry();
    geom.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
    const lines=new THREE.LineSegments(geom,new THREE.LineBasicMaterial({color:0x4080c0,transparent:true,opacity:0.25,depthWrite:false,blending:THREE.AdditiveBlending}));
    lines.visible=state.showLines;scene.add(lines);constellationLines[id]=lines;
    if(info.display&&info.display.length>=2){
      constellationLabels[id]={pos:radecToXYZ(lonToRA(info.display[0]||0),info.display[1]||0,SPHERE_R*0.99),text:info.ja};
    }
  });
}

// ============================================================
// Milky Way
// ============================================================
function createMilkyWay(mwData){
  if(!mwData||!mwData.features)return;
  const N=15000,pos=new Float32Array(N*3),col=new Float32Array(N*3),sz=new Float32Array(N);
  const ac=[];
  mwData.features.forEach(f=>{if(f.geometry&&f.geometry.coordinates)f.geometry.coordinates.forEach(p=>{const r=Array.isArray(p[0][0])?p[0]:p;r.forEach(c=>ac.push(c));});});
  for(let i=0;i<N;i++){
    let ra,dec;
    if(ac.length>0&&Math.random()<0.7){const b=ac[Math.floor(Math.random()*ac.length)];ra=lonToRA(b[0])+(Math.random()-0.5)*15;dec=b[1]+(Math.random()-0.5)*8;}
    else{const gl=Math.random()*360,gb=(Math.random()-0.5)*12,l=gl*Math.PI/180,b=gb*Math.PI/180,NR=192.85948*Math.PI/180,ND=27.12825*Math.PI/180,AN=32.93192*Math.PI/180;
    const sd=Math.sin(ND)*Math.sin(b)+Math.cos(ND)*Math.cos(b)*Math.cos(l-AN);dec=Math.asin(sd)*180/Math.PI;const y=Math.cos(b)*Math.sin(l-AN),x=Math.cos(ND)*Math.sin(b)-Math.sin(ND)*Math.cos(b)*Math.cos(l-AN);ra=(Math.atan2(y,x)+NR)*180/Math.PI;ra=((ra%360)+360)%360;}
    const p=radecToXYZ(ra,dec,SPHERE_R*0.997+Math.random()*2);
    pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;
    const br=0.3+Math.random()*0.4;col[i*3]=br*(0.7+Math.random()*0.3);col[i*3+1]=br*(0.75+Math.random()*0.25);col[i*3+2]=br*(0.85+Math.random()*0.15);
    sz[i]=1.0+Math.random()*3.0;
  }
  const geom=new THREE.BufferGeometry();
  geom.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geom.setAttribute('color',new THREE.BufferAttribute(col,3));
  geom.setAttribute('size',new THREE.BufferAttribute(sz,1));
  const vs=`attribute float size;varying vec3 vColor;void main(){vColor=color;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*(150.0/-mv.z);gl_Position=projectionMatrix*mv;}`;
  const fs=`varying vec3 vColor;void main(){float d=length(gl_PointCoord-vec2(0.5));if(d>0.5)discard;float a=exp(-d*3.0)*0.25;gl_FragColor=vec4(vColor,a);}`;
  milkyWayMesh=new THREE.Points(geom,new THREE.ShaderMaterial({vertexShader:vs,fragmentShader:fs,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  milkyWayMesh.visible=state.showMilkyWay;scene.add(milkyWayMesh);
}

// ============================================================
// Horizon Grid
// ============================================================
function createHorizonGrid(){
  gridGroup=new THREE.Group();gridGroup.name='grid';gridGroup.visible=state.showGrid;
  for(let alt=0;alt<=80;alt+=20){const pts=[];for(let az=0;az<=360;az+=2){const a=az*Math.PI/180,al=alt*Math.PI/180,r=SPHERE_R*0.99;pts.push(new THREE.Vector3(r*Math.cos(al)*Math.sin(a),r*Math.sin(al),-r*Math.cos(al)*Math.cos(a)));}
  gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x304060,transparent:true,opacity:0.15})));}
  scene.add(gridGroup);
}

// ============================================================
// Camera & Gyro
// ============================================================
function updateCameraFromAngles(){
  if(camAnimating){
    // Smooth animation with ease-in-out
    camAnimT+=1/60/CAM_ANIM_DURATION;
    if(camAnimT>=1){camAnimT=1;camAnimating=false;}
    const t=camAnimT<0.5?2*camAnimT*camAnimT:(1-Math.pow(-2*camAnimT+2,2)/2); // easeInOutQuad
    camTheta=camFromTheta+(camToTheta-camFromTheta)*t;
    // Handle shortest path for phi (wrap around)
    let dPhi=camToPhi-camFromPhi;
    if(dPhi>Math.PI)dPhi-=2*Math.PI;
    if(dPhi<-Math.PI)dPhi+=2*Math.PI;
    camPhi=camFromPhi+dPhi*t;
  }
  const target=new THREE.Vector3(Math.sin(camTheta)*Math.cos(camPhi),Math.cos(camTheta),Math.sin(camTheta)*Math.sin(camPhi));
  camera.lookAt(target.multiplyScalar(SPHERE_R));
}

function startCameraAnimation(toTheta,toPhi){
  camFromTheta=camTheta;camFromPhi=camPhi;
  camToTheta=toTheta;camToPhi=toPhi;
  camAnimT=0;camAnimating=true;
}

function setupGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    document.getElementById('gyroPrompt').classList.remove('hidden');
    document.getElementById('gyroBtn').addEventListener('click',async()=>{try{const p=await DeviceOrientationEvent.requestPermission();if(p==='granted')enableGyro();}catch(e){}document.getElementById('gyroPrompt').classList.add('hidden');});
  }else if('DeviceOrientationEvent' in window){window.addEventListener('deviceorientation',e=>{if(e.alpha!==null)enableGyro();},{once:true});}
}
function enableGyro(){state.useGyro=true;window.addEventListener('deviceorientation',e=>{state.gyroAlpha=(e.alpha||0)*Math.PI/180;state.gyroBeta=(e.beta||0)*Math.PI/180;state.gyroGamma=(e.gamma||0)*Math.PI/180;});}
function updateCameraFromGyro(){if(!state.useGyro)return;camera.quaternion.setFromEuler(new THREE.Euler(state.gyroBeta-Math.PI/2,state.gyroAlpha,-state.gyroGamma,'YXZ'));}

// ============================================================
// Touch Controls
// ============================================================
function setupTouch(){
  const el=renderer.domElement;let touching=false;
  el.addEventListener('touchstart',e=>{if(e.touches.length===1){touching=true;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;camAnimating=false;}},{passive:true});
  el.addEventListener('touchmove',e=>{if(!touching||state.useGyro)return;const dx=e.touches[0].clientX-touchStartX,dy=e.touches[0].clientY-touchStartY;camPhi-=dx*0.005;camTheta=Math.max(0.1,Math.min(Math.PI-0.1,camTheta+dy*0.005));touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',()=>{touching=false;},{passive:true});
  let md=false;
  el.addEventListener('mousedown',e=>{md=true;touchStartX=e.clientX;touchStartY=e.clientY;camAnimating=false;});
  el.addEventListener('mousemove',e=>{if(!md||state.useGyro)return;camPhi-=(e.clientX-touchStartX)*0.003;camTheta=Math.max(0.1,Math.min(Math.PI-0.1,camTheta+(e.clientY-touchStartY)*0.003));touchStartX=e.clientX;touchStartY=e.clientY;});
  el.addEventListener('mouseup',()=>{md=false;});
}

// ============================================================
// Sky Rotation
// ============================================================
function updateSkyRotation(){
  if(!starPoints)return;
  const jd=julianDate(state.date),lst=localSiderealTime(jd,state.lon),latR=state.lat*Math.PI/180,lstR=lst*Math.PI/180;
  [starPoints,milkyWayMesh,...Object.values(constellationLines)].forEach(o=>{if(!o)return;o.rotation.set(0,0,0);o.rotation.x=-(Math.PI/2-latR);o.rotation.y=-lstR;});
}

// ============================================================
// Auto-detect constellation at screen center
// ============================================================
function getConstellationAtCenter(){
  // Get camera forward direction in world space
  const dir=new THREE.Vector3(0,0,-1);
  dir.applyQuaternion(camera.quaternion);

  // For each constellation label, compute angle to camera direction
  // But label positions are in the rotated sky frame, so we need to
  // apply the same rotation as the sky objects
  let bestId=null,bestDot=-2;
  const ids=Object.keys(constellationLabels);
  if(ids.length===0||!starPoints)return null;

  // Get the sky rotation matrix from starPoints
  const skyMatrix=new THREE.Matrix4();
  skyMatrix.makeRotationFromEuler(starPoints.rotation);

  for(const id of ids){
    const lbl=constellationLabels[id];
    // Transform label position by sky rotation
    const worldPos=lbl.pos.clone().applyMatrix4(skyMatrix).normalize();
    const dot=worldPos.dot(dir);
    if(dot>bestDot){bestDot=dot;bestId=id;}
  }

  // Only return if within ~30 degrees of center
  return bestDot>0.85?bestId:null;
}

// ============================================================
// Highlight Management
// ============================================================
function applyHighlight(id){
  if(!id)return;
  // Highlight lines
  if(constellationLines[id]){
    constellationLines[id].material.opacity=0.85;
    constellationLines[id].material.color.setHex(0xa0d4ff);
  }
  // Highlight stars
  if(constellationStarIndices[id]&&starGeometry){
    const sz=starGeometry.attributes.size,cl=starGeometry.attributes.color,bc=starGeometry.attributes.baseColor;
    constellationStarIndices[id].forEach(idx=>{
      const baseSz=magToSize(rawStarData.features[idx].properties.mag);
      sz.array[idx]=baseSz*2.5+3.0;
      cl.array[idx*3]=Math.min(1,bc.array[idx*3]*1.4+0.3);
      cl.array[idx*3+1]=Math.min(1,bc.array[idx*3+1]*1.3+0.3);
      cl.array[idx*3+2]=Math.min(1,bc.array[idx*3+2]*1.2+0.4);
    });
    sz.needsUpdate=true;cl.needsUpdate=true;
  }
}

function removeHighlight(id){
  if(!id)return;
  // Reset lines
  if(constellationLines[id]){
    constellationLines[id].material.opacity=0.25;
    constellationLines[id].material.color.setHex(0x4080c0);
  }
  // Reset stars
  if(constellationStarIndices[id]&&starGeometry&&rawStarData){
    const sz=starGeometry.attributes.size,cl=starGeometry.attributes.color,bc=starGeometry.attributes.baseColor;
    constellationStarIndices[id].forEach(idx=>{
      sz.array[idx]=magToSize(rawStarData.features[idx].properties.mag);
      cl.array[idx*3]=bc.array[idx*3];cl.array[idx*3+1]=bc.array[idx*3+1];cl.array[idx*3+2]=bc.array[idx*3+2];
    });
    sz.needsUpdate=true;cl.needsUpdate=true;
  }
}

function updateAutoHighlight(){
  const centerId=getConstellationAtCenter();
  if(centerId===state.selectedConstellation)return;

  // Remove old highlight
  if(state.selectedConstellation)removeHighlight(state.selectedConstellation);

  state.selectedConstellation=centerId;

  // Apply new highlight
  if(centerId)applyHighlight(centerId);

  // Update label
  const lb=document.getElementById('constellation-label');
  if(state.showNames&&centerId&&constellationLabels[centerId]){
    lb.textContent=constellationLabels[centerId].text;
    lb.classList.add('visible');
  }else{
    lb.classList.remove('visible');
  }

  // Update list active state
  document.querySelectorAll('.const-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.id===centerId);
  });
}

// ============================================================
// Constellation list tap → navigate or show guide
// ============================================================
function navigateToConstellation(id){
  if(!constellationLabels[id])return;

  // Close panel
  document.getElementById('panel').classList.remove('open');

  if(state.useGyro){
    // Gyro mode: show direction guide
    showDirectionGuide(id);
  }else{
    // Non-gyro: smooth camera animation
    const skyMatrix=new THREE.Matrix4();
    skyMatrix.makeRotationFromEuler(starPoints.rotation);
    const worldPos=constellationLabels[id].pos.clone().applyMatrix4(skyMatrix).normalize();
    const toTheta=Math.acos(worldPos.y);
    const toPhi=Math.atan2(worldPos.z,worldPos.x);
    startCameraAnimation(toTheta,toPhi);
  }
}

// ============================================================
// Direction Guide (for gyro mode)
// ============================================================
function showDirectionGuide(id){
  if(!constellationLabels[id]||!starPoints)return;

  const guide=document.getElementById('direction-guide');
  const nameEl=guide.querySelector('.guide-name');
  const infoEl=guide.querySelector('.guide-info');
  const arrowEl=guide.querySelector('.guide-arrow');

  const info=constellationData[id];
  nameEl.textContent=info?info.ja:id;

  // Compute direction in observer's frame
  const skyMatrix=new THREE.Matrix4();
  skyMatrix.makeRotationFromEuler(starPoints.rotation);
  const worldPos=constellationLabels[id].pos.clone().applyMatrix4(skyMatrix).normalize();

  // Azimuth (from north, clockwise)
  const az=((Math.atan2(worldPos.x,-worldPos.z)*180/Math.PI)+360)%360;
  // Altitude
  const alt=Math.asin(worldPos.y)*180/Math.PI;

  const dirs=['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
  const dirName=dirs[Math.round(az/22.5)%16];

  if(alt<-5){
    infoEl.textContent=`${dirName}  地平線の下 (${Math.abs(Math.round(alt))}°)`;
  }else{
    infoEl.textContent=`${dirName}  仰角 ${Math.round(alt)}°`;
  }

  // Arrow rotation: compute angle from camera forward to target in screen space
  const camDir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  const camUp=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
  const camRight=new THREE.Vector3().crossVectors(camDir,camUp).normalize();
  const toTarget=worldPos.clone().sub(camDir.clone().multiplyScalar(worldPos.dot(camDir)));
  const screenX=toTarget.dot(camRight);
  const screenY=toTarget.dot(camUp);
  const angle=Math.atan2(-screenX,screenY)*180/Math.PI;
  arrowEl.style.transform=`rotate(${angle}deg)`;

  guide.classList.add('visible');

  // Auto-hide after 4 seconds
  if(guideTimer)clearTimeout(guideTimer);
  guideTimer=setTimeout(()=>{guide.classList.remove('visible');},4000);
}

// ============================================================
// Settings
// ============================================================
function applySettings(){
  Object.values(constellationLines).forEach(l=>{l.visible=state.showLines;});
  if(milkyWayMesh)milkyWayMesh.visible=state.showMilkyWay;
  if(gridGroup)gridGroup.visible=state.showGrid;
  // Label will be updated by updateAutoHighlight
}

// ============================================================
// UI Setup
// ============================================================
function setupUI(){
  const panel=document.getElementById('panel');
  document.getElementById('panel-toggle').addEventListener('click',()=>panel.classList.add('open'));
  document.getElementById('panel-close').addEventListener('click',()=>panel.classList.remove('open'));
  document.querySelectorAll('.tab-btn').forEach(btn=>{btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
    document.getElementById('tab-constellations').style.display=btn.dataset.tab==='constellations'?'':'none';
    document.getElementById('tab-settings').style.display=btn.dataset.tab==='settings'?'':'none';
    document.getElementById('tab-datetime').style.display=btn.dataset.tab==='datetime'?'':'none';
  });});
  document.querySelectorAll('.toggle').forEach(el=>{el.addEventListener('click',()=>{el.classList.toggle('on');state[el.dataset.setting]=el.classList.contains('on');applySettings();});});
  document.querySelector('[data-setting="starBrightness"]').addEventListener('input',e=>{state.starBrightness=parseFloat(e.target.value);updateStarSizes();});
  document.getElementById('mag-limit').addEventListener('change',e=>{state.magLimit=parseInt(e.target.value);updateStarSizes();});
  const now=new Date();
  document.getElementById('inp-date').value=now.toISOString().split('T')[0];
  document.getElementById('inp-time').value=now.toTimeString().slice(0,5);
  document.getElementById('inp-lat').value=state.lat;
  document.getElementById('inp-lon').value=state.lon;
  document.getElementById('btn-now').addEventListener('click',()=>{state.date=new Date();const n=new Date();document.getElementById('inp-date').value=n.toISOString().split('T')[0];document.getElementById('inp-time').value=n.toTimeString().slice(0,5);requestCurrentPosition();});
  document.getElementById('btn-apply').addEventListener('click',()=>{const d=document.getElementById('inp-date').value,t=document.getElementById('inp-time').value;state.date=new Date(d+'T'+t);state.lat=parseFloat(document.getElementById('inp-lat').value)||35.68;state.lon=parseFloat(document.getElementById('inp-lon').value)||139.77;});
  document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.const-item').forEach(el=>{el.style.display=(el.querySelector('.ja').textContent+el.querySelector('.latin').textContent).toLowerCase().includes(q)?'':'none';});});
}

function populateConstellationList(){
  const list=document.getElementById('tab-constellations');
  Object.entries(constellationData).sort((a,b)=>(a[1].ja||'').localeCompare(b[1].ja||'','ja')).forEach(([id,info])=>{
    const el=document.createElement('div');el.className='const-item';el.dataset.id=id;
    el.innerHTML=`<span class="ja">${info.ja}</span><span class="latin">${info.name}</span>`;
    el.addEventListener('click',()=>navigateToConstellation(id));
    list.appendChild(el);
  });
}

// ============================================================
// Geolocation & Info
// ============================================================
function requestCurrentPosition(){if('geolocation' in navigator)navigator.geolocation.getCurrentPosition(p=>{state.lat=p.coords.latitude;state.lon=p.coords.longitude;document.getElementById('inp-lat').value=state.lat.toFixed(4);document.getElementById('inp-lon').value=state.lon.toFixed(4);},()=>{},{timeout:5000});}

function updateInfo(){
  const n=state.date;document.getElementById('info-time').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  document.getElementById('info-location').textContent=state.lat.toFixed(1)+'°N '+state.lon.toFixed(1)+'°E';
  let h=state.useGyro?(state.gyroAlpha*180/Math.PI):((-camPhi*180/Math.PI+360)%360);
  document.getElementById('compass').textContent=['N','NE','E','SE','S','SW','W','NW'][Math.round(h/45)%8];
}

// ============================================================
// Animation Loop
// ============================================================
function animate(){
  requestAnimationFrame(animate);
  state.date=new Date();
  updateSkyRotation();
  state.useGyro?updateCameraFromGyro():updateCameraFromAngles();
  updateAutoHighlight();
  updateInfo();
  renderer.render(scene,camera);
}

function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}

// ============================================================
// Init
// ============================================================
async function init(){
  initScene();setupTouch();setupGyro();setupUI();requestCurrentPosition();
  const data=await loadData();const lb=document.getElementById('loadbar');
  lb.style.width='75%';createStars(data.stars);
  lb.style.width='85%';createConstellationLines(data.lines,data.names);populateConstellationList();
  lb.style.width='92%';createMilkyWay(data.mw);createHorizonGrid();
  lb.style.width='100%';window.addEventListener('resize',onResize);
  setTimeout(()=>{document.getElementById('loading').classList.add('hidden');animate();},500);
}
init();
</script>
