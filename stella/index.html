<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Stella - 星座ビューア</title>
<link rel="stylesheet" href="./assets/css/stella.css">
</head>
<body>
<div id="loading"><h1>STELLA</h1><div class="sub">星座ビューアを読み込み中</div><div class="bar"><div class="fill" id="loadbar"></div></div></div>
<div class="gyro-prompt hidden" id="gyroPrompt"><button id="gyroBtn">ジャイロセンサーを有効にする</button></div>
<div id="menubar">
  <div id="menu-left"><a id="back-link" href="../"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Gallery</a><div id="compass">N</div></div>
  <div id="menu-right"><div id="info"><div id="info-time">--:--</div><div id="info-location">--</div></div></div>
</div>
<div id="constellation-label"></div>
<div id="direction-guide"><div class="guide-arrow">↑</div><div class="guide-name"></div><div class="guide-info"></div></div>
<button id="panel-toggle">☰ 星座一覧</button>
<div id="panel">
  <div id="panel-header"><input type="text" id="search" placeholder="星座を検索..."><button id="panel-close">✕</button></div>
  <div id="panel-tabs">
    <button class="tab-btn active" data-tab="constellations">星座</button>
    <button class="tab-btn" data-tab="settings">表示設定</button>
    <button class="tab-btn" data-tab="datetime">日時・場所</button>
  </div>
  <div id="panel-body">
    <div id="tab-constellations" class="constellation-list"></div>
    <div id="tab-settings" class="settings-content" style="display:none">
      <div class="setting-row"><label>星座線</label><div class="toggle on" data-setting="showLines"></div></div>
      <div class="setting-row"><label>星座名</label><div class="toggle on" data-setting="showNames"></div></div>
      <div class="setting-row"><label>天の川</label><div class="toggle on" data-setting="showMilkyWay"></div></div>
      <div class="setting-row"><label>地平線グリッド</label><div class="toggle" data-setting="showGrid"></div></div>
      <div class="setting-row"><label>星の明るさ</label><input type="range" min="0.5" max="5" step="0.1" value="2.5" data-setting="starBrightness"></div>
      <div class="setting-row"><label>表示する星</label><select id="mag-limit"><option value="3">3等星まで（明るい星のみ）</option><option value="4">4等星まで</option><option value="5">5等星まで</option><option value="6" selected>6等星まで（すべて）</option></select></div>
    </div>
    <div id="tab-datetime" class="datetime-content" style="display:none">
      <label>日付</label><input type="date" id="inp-date">
      <label>時刻</label><input type="time" id="inp-time">
      <label>緯度</label><input type="number" id="inp-lat" step="0.01" placeholder="35.68">
      <label>経度</label><input type="number" id="inp-lon" step="0.01" placeholder="139.77">
      <div class="btn-row"><button id="btn-now" class="primary">現在に戻す</button><button id="btn-apply">適用</button></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./assets/js/stella.js"></script>
</body>
</html>
